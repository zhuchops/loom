# Builds a release for every pushed version tag (v1.2.3): the terminal loom
# for macOS and Linux, Loom.app for Macs, and loom-desktop for Linux, then
# publishes them with checksums.txt. install.sh downloads from these.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh packaging/release.sh terminal
      - uses: actions/upload-artifact@v4
        with:
          name: terminal
          path: dist/release/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh packaging/release.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/release/*

  linux-desktop:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: sh packaging/release.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-${{ matrix.runner }}
          path: dist/release/*

  publish:
    needs: [terminal, macos, linux-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # Points the Homebrew formula and cask in this repository at the new
  # release, so brew upgrade finds it.
  # Runs one at a time, and only for the newest tag, so releases built side by
  # side neither race nor point Homebrew back at an older one.
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    concurrency: homebrew
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update the formula and the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "$GITHUB_REF_NAME is not the newest release ($newest); leaving Homebrew alone"
            exit 0
          fi
          version=${GITHUB_REF_NAME#v}
          sha=$(gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p checksums.txt -O - | awk '$2 == "Loom_darwin_universal.zip" {print $1}')
          test -n "$sha"
          sed -i -E "s/tag: \"v[^\"]+\"/tag: \"$GITHUB_REF_NAME\"/" Formula/loom.rb
          sed -i -E "s/^  version \"[^\"]+\"/  version \"$version\"/; s/^  sha256 \"[^\"]+\"/  sha256 \"$sha\"/" Casks/loom-desktop.rb
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Homebrew: $GITHUB_REF_NAME"
          git pull --rebase origin main
          git push origin HEAD:main
