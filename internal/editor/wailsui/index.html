<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="title"></header>
  <aside id="sidebar"></aside>
  <nav id="tabs"></nav>
  <nav id="crumbs"></nav>
  <main id="editor">
    <div id="grid"></div>
    <div id="cursor"></div>
    <div id="panes"></div>
  </main>
  <footer id="status"></footer>
  <div id="layers"></div>
</div>
<textarea id="input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Editor input"></textarea>
<span id="measure"></span>
<script src="icons.js"></script>
<script src="app.js"></script>
<script src="chrome.js"></script>
<script src="popups.js"></script>
</body>
</html>
